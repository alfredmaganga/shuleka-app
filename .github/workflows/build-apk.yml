name: Build APK
on:
  push:
    branches: [main]
    paths: ['android-app/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Build Debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shuleka-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
      
      - name: Generate Keystore
        if: success()
        run: |
          keytool -genkey -v -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias shuleka \
            -storepass shuleka2026 -keypass shuleka2026 \
            -dname "CN=Shuleka,OU=Shuleka,O=Shuleka,L=Dar,ST=Dar,C=TZ"
      
      - name: Build Release APK
        if: success()
        working-directory: android-app
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=shuleka2026 \
            -Pandroid.injected.signing.key.alias=shuleka \
            -Pandroid.injected.signing.key.password=shuleka2026
      
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shuleka-release-apk
          path: android-app/app/build/outputs/apk/release/*.apk
