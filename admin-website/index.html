<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shuleka — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">📚</div>
        <h1 class="logo-text">Shuleka</h1>
        <p class="logo-sub">Admin Panel</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Barua pepe</label>
          <input type="email" id="email" placeholder="admin@shuleka.com" required>
        </div>
        <div class="form-group">
          <label for="password">Neno la siri</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Ingia</button>
        <p class="error-text" id="errorMsg"></p>
      </form>
    </div>
  </div>
  <script>
    // Inline config so there's no race condition
    const SUPABASE_URL = 'https://uiwgbviucbbqcxdkpdwa.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVpd2didml1Y2JicWN4ZGtwZHdhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNzI4MjIsImV4cCI6MjEwMDc0ODgyMn0.FN3z7fr4sbkMCIlTq_pXxccz0a-kqBUXghksoFYKJWg';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Now supabase is definitely loaded (var supabase = ...)
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        window.location.href = 'dashboard.html';
        return;
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');

        btn.textContent = 'Inaingia...';
        btn.disabled = true;
        errorMsg.textContent = '';

        try {
          const { data, error } = await sb.auth.signInWithPassword({ email, password });

          if (error) {
            errorMsg.textContent = 'Hitilafu: ' + error.message;
            btn.textContent = 'Ingia';
            btn.disabled = false;
            return;
          }

          await sb.auth.getSession();
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorMsg.textContent = 'Hitilafu: ' + err.message;
          btn.textContent = 'Ingia';
          btn.disabled = false;
        }
      });
    }
    init();
  </script>
</body>
</html>
